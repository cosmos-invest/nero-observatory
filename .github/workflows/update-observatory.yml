name: Update Nero Observatory

on:
  schedule:
    # 19:35 / 19:50 / 20:05 / 20:20 JST
    - cron: "35 10 * * *"
    - cron: "50 10 * * *"
    - cron: "5 11 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-observatory.mjs
      - scripts/complete-dashboard.mjs
      - scripts/finalize-observation.mjs
      - .github/workflows/update-observatory.yml

permissions:
  contents: write

concurrency:
  group: nero-observatory-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser client
        run: npm install --no-save --ignore-scripts playwright-core

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium was not found on the runner."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Collect public and first-page note data
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/sync-observatory.mjs

      - name: Complete all dashboard pages
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: node scripts/complete-dashboard.mjs

      - name: Select official daily cut
        run: node scripts/finalize-observation.mjs

      - name: Validate generated public data
        run: |
          node -e "for (const f of ['data/public_dashboard.json','data/article_metrics.json','data/articles.json','data/mentions.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"
          if grep -R -E 'sales_yen|purchase_count|purchase_summary|buyer_email|order_id|gmail_message_id|NOTE_SESSION_COOKIE' data; then
            echo 'Sensitive field detected in public data.'
            exit 1
          fi

      - name: Commit changed observations
        shell: bash
        run: |
          git config user.name "nero-observatory[bot]"
          git config user.email "nero-observatory[bot]@users.noreply.github.com"
          git add data/articles.json data/article_metrics.json data/public_dashboard.json
          if git diff --cached --quiet; then
            echo "No observation changes."
            exit 0
          fi
          git commit -m "data: refresh Nero Observatory"
          git push
