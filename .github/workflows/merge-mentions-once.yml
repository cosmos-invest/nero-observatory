name: Merge Nero Mentions Once
on:
  push:
    paths:
      - '.github/workflows/merge-mentions-once.yml'
      - 'data/mentions_pending.json'
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Merge pending introductions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('data/mentions.json','utf8'));
          const q = JSON.parse(fs.readFileSync('data/mentions_pending.json','utf8'));
          const key = u => (String(u||'').match(/\/notes\/(n[0-9a-f]+)/i)||[])[1]?.toLowerCase() || String(u||'').split(/[?#]/)[0].replace(/\/$/,'');
          const seen = new Set(p.records.map(r => key(r.article_url)));
          const add = q.records.filter(r => !seen.has(key(r.article_url))).map(r => ({actor:r.actor,article_title:r.article_title,article_url:r.article_url,introduced_at:r.introduced_at}));
          p.records = [...add, ...p.records].sort((a,b)=>Date.parse(b.introduced_at)-Date.parse(a.introduced_at));
          p.total_count = p.records.length;
          p.generated_at = q.generated_at;
          fs.writeFileSync('data/mentions.json', JSON.stringify(p,null,2)+'\n');
          console.log(`added=${add.length} total=${p.total_count}`);
          NODE
      - name: Commit merged mentions
        run: |
          git config user.name 'nero-observatory[bot]'
          git config user.email 'nero-observatory[bot]@users.noreply.github.com'
          git add data/mentions.json
          git commit -m 'data: sync note introductions' || true
          git push
