name: Check public observatory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check analysis-core.mjs
          node --check observatory-core.mjs
          node --check scripts/sync-observatory.mjs
          node --check scripts/complete-dashboard.mjs
          node --check scripts/finalize-observation.mjs
          node --check scripts/mobile-smoke.mjs
          node --check scripts/build-cloudflare.mjs

      - name: Check JSON data
        run: |
          node -e "for (const f of ['data/public_dashboard.json','data/article_metrics.json','data/articles.json','data/mentions.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('json ok')"

      - name: Guard sensitive fields
        run: |
          if grep -R -E 'sales_yen|purchase_count|purchase_summary|buyer_email|order_id|gmail_message_id|NOTE_SESSION_COOKIE' data; then
            echo 'Sensitive field detected in public data.'
            exit 1
          fi

      - name: Build Cloudflare Pages bundle
        run: |
          node scripts/build-cloudflare.mjs
          test -f dist/index.html
          test -f dist/data/public_dashboard.json
          if grep -R -E 'sales_yen|purchase_count|purchase_summary|buyer_email|order_id|gmail_message_id|NOTE_SESSION_COOKIE' dist; then
            echo 'Sensitive field detected in Cloudflare bundle.'
            exit 1
          fi

      - name: Install browser client
        run: npm install --no-save --ignore-scripts playwright-core

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome/Chromium was not found on the runner."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Mobile layout smoke test
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nero-observatory-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/mobile-smoke.mjs
